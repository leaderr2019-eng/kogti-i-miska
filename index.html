<style>
/* Landscape-only game. The 16:9 stage is fitted into the window by JS; every in-stage HTML size is a multiple of --u (one canvas pixel), so the UI scales with the field on phones, tablets and desktops alike. */
:root{
  --night:#1b1712; --wood:#3b2618; --wood2:#5a3a22; --rim:#9c6a3a; --gold:#f2b84b;
  --cream:#f6e7c8; --muted:#c4b294; --fish:#7fd3e6; --heart:#ef6b73; --leaf:#7cc45a;
  --display:'GameDisplay','GameUI',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'GameUI',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:#120e0a;color:var(--cream);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{font-family:var(--body);line-height:1.3}
img{-webkit-user-drag:none;user-select:none}
.fit{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:radial-gradient(ellipse at center,#2b1e15 0%,#120e0a 75%)}
.stage{--u:1.5px;position:relative;width:960px;height:540px;overflow:hidden;background:#3a2a1c;box-shadow:0 0 0 2px #24160f,0 0 30px #000a}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:pointer;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:safe center;background:rgba(18,12,8,.68);padding:calc(8*var(--u));overflow:auto;overscroll-behavior:contain;touch-action:pan-y;z-index:3}
.card{background:var(--wood);border:calc(2*var(--u)) solid #24160f;box-shadow:inset 0 0 0 calc(1.5*var(--u)) var(--rim),0 calc(3*var(--u)) 0 #24160f;border-radius:calc(4*var(--u));padding:calc(11*var(--u)) calc(15*var(--u));width:min(100%,calc(340*var(--u)));display:grid;gap:calc(6*var(--u));text-align:center}
.card.wide{width:min(100%,calc(560*var(--u)));padding:calc(10*var(--u)) calc(12*var(--u))}
.card.mid{width:min(100%,calc(420*var(--u)))}
.card h2{font-family:var(--display);color:var(--gold);margin:0;font-size:calc(18*var(--u));line-height:1.1;text-wrap:balance;text-shadow:calc(1.5*var(--u)) calc(1.5*var(--u)) 0 #24160f}
.card p{margin:0;font-size:calc(10*var(--u))}
.card .muted{color:var(--muted);font-size:calc(9*var(--u))}
.card .boss{color:var(--heart);font-family:var(--display);font-size:calc(11*var(--u))}
.bcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(8*var(--u))}
.bcard{display:grid;grid-template-rows:auto auto 1fr auto;justify-items:center;align-items:start;gap:calc(3*var(--u));padding:calc(8*var(--u)) calc(6*var(--u));min-height:calc(128*var(--u));background:linear-gradient(#6a4628,#3b2618);animation:cardin .45s cubic-bezier(.2,1.4,.4,1) both}

function tintCanvas(c,mode){const o=mk(c.width,c.height),g=o.getContext('2d');g.drawImage(c,0,0);const d=g.getImageData(0,0,o.width,o.height),a=d.data;
  const M={necro:[[.74,18],[.9,30],[.72,20]],ghost:[[.7,64],[.86,80],[.95,104]],tech:[[.66,32],[.76,38],[.92,52]],alien:[[.62,62],[.42,26],[.9,74]]}[mode];
  for(let i=0;i<a.length;i+=4){if(a[i+3]<10)continue;const l=a[i]*.3+a[i+1]*.59+a[i+2]*.11;if(l<44)continue;a[i]=Math.min(255,l*M[0][0]+M[0][1]);a[i+1]=Math.min(255,l*M[1][0]+M[1][1]);a[i+2]=Math.min(255,l*M[2][0]+M[2][1])}
  g.putImageData(d,0,0);return o}

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genWaves(L){
  if(L.waves)return L.waves;const rnd=mulberry(L.seed*131+7),out=[];
  for(let w=0;w<L.nw;w++){const budget=(L.b0+L.bk*w)*(L.boss&&w===L.nw-1?(L.lastMul||1):1),ng=w<2?1:w<5?2:3,groups=[];
    for(let g=0;g<ng;g++){const ia=L.intro&&ENEMY[L.intro].w>=10?3:1;let type=(w===ia&&g===0&&L.intro)?L.intro:L.pool[(rnd()*L.pool.length)|0];for(let tr=0;w<2&&type!==L.intro&&ENEMY[type].w>=5&&tr<20;tr++)type=L.pool[(rnd()*L.pool.length)|0];const E=ENEMY[type];
      groups.push([type,Math.max(1,Math.round(budget/ng/E.w)),+(E.gap*(1-.025*w)).toFixed(2)])}
    if(L.boss&&w===L.nw-1)groups.splice(1,0,[L.boss,1,3]);
    out.push(groups)}
  return out}

function ensureDaily(){const day=dayStr();if(SAVE.dt&&SAVE.dt.day===day)return SAVE.dt;const r=mulberry(dayNum()*31+5),pool=TASKS.filter(t=>!t.need||t.need()),ids=[];
  while(ids.length<3&&pool.length){const t=pool.splice((r()*pool.length)|0,1)[0];ids.push({k:t.k,v:t.v[(r()*t.v.length)|0]})}
  const base={};for(const k of ST_KEYS)base[k]=st()[k]|0;SAVE.dt={day,list:ids,base,done:[0,0,0],bonus:0};persist();return SAVE.dt}
const taskProg=(t,i)=>Math.min(t.v,(st()[t.k]|0)-(SAVE.dt.base[t.k]|0));
const taskName=t=>TASKS.find(x=>x.k===t.k).n(t.v);
function grant(r){if(!r)return;if(r.yarn)SAVE.bonus=(SAVE.bonus|0)+r.yarn;if(r.chest)SAVE.chests+=r.chest;if(r.ore)for(const k in r.ore)SAVE.ore[k]=(SAVE.ore[k]|0)+r.ore[k]}
const rewardText=r=>[r.yarn?'+'+r.yarn+' 🧶':'',r.chest?'сундук героев'+(r.chest>1?' ×'+r.chest:''):'',...(r.ore?Object.keys(r.ore).map(k=>`<span class="ore"><img alt="" src="${oreURL(k)}">+${r.ore[k]}</span>`):[])].filter(Boolean).join(' ');

function achCheck(){if(SIM)return[];const out=[];SAVE.ach=SAVE.ach||{};
  for(const a of ACH){if(SAVE.ach[a.id])continue;const [c,m]=a.g();if(c>=m){SAVE.ach[a.id]=1;grant(a.r);out.push({kind:'ach',n:a.n,r:a.r})}}
  const D=ensureDaily();D.list.forEach((t,i)=>{if(!D.done[i]&&taskProg(t)>=t.v){D.done[i]=1;st().tasks=(st().tasks|0)+1;grant(TASK_R[i]);out.push({kind:'task',n:taskName(t),r:TASK_R[i]})}});
  if(!D.bonus&&D.done.every(Boolean)){D.bonus=1;grant({chest:1});out.push({kind:'task',n:'Все задания дня',r:{chest:1}})}
  if(out.length||ACH_DIRTY){ACH_DIRTY=false;persist()}return out}

function achHtml(){const D=ensureDaily(),done=ACH.filter(a=>SAVE.ach&&SAVE.ach[a.id]).length,now=new Date(),left=24*60-(now.getHours()*60+now.getMinutes());
  const bar=(c,m)=>`<span class="pw"><span class="pbar"><i style="width:${Math.round(Math.min(1,c/m)*100)}%"></i></span><small>${Math.min(c,m)} / ${m}</small></span>`;

const AFF_KEYS=Object.keys(AFF);
function affChance(){if(RUN&&RUN.kind==='endless')return Math.min(.28,Math.max(0,.025*(S.wave-4)));const base=RUN&&RUN.kind==='daily'?.08:0;return Math.max(base,LVI<30?0:Math.min(.18,.04+(LVI-30)*.002))}
function rollAffix(e){if(!e||ENEMY[e.type].boss||e.elite)return;const p=affChance();if(!p||Math.random()>=p)return;
  const n=RUN&&RUN.kind==='endless'&&S.wave>=25&&Math.random()<.35?2:1,list=[];while(list.length<n){const k=AFF_KEYS[(Math.random()*AFF_KEYS.length)|0];if(!list.includes(k))list.push(k)}
  e.aff=list;e.am=1;for(const k of list){if(k==='fast'){e.am*=1.4;e.hp*=1.2;e.max*=1.2}if(k==='giant'){e.am*=.85;e.hp*=2.2;e.max*=2.2;e.big=1}if(k==='shield')e.sh=e.max*.35;if(k==='armor')e.arm2=.3}
  e.hp*=1.15;e.max*=1.15;

function affTick(e,dt){e.afT=(e.afT||0)+dt;const a=e.aff;
  if(a.includes('shield')&&e.afT%8<dt)e.sh=Math.max(e.sh||0,e.max*.18);
  if(a.includes('heal')){e.ahT=(e.ahT||0)+dt;if(e.ahT>=2){e.ahT=0;let any=0;for(const o of S.enemies)if(o!==e&&!o.dead&&!ENEMY[o.type].boss&&o.hp<o.max&&Math.hypot(o.x-e.x,o.y-e.y)<40){o.hp=Math.min(o.max,o.hp+o.max*.05);any=1}if(any)boom(e.x,e.y,40,'#7cf06a')}}
  if(a.includes('ghost')){e.agT=(e.agT||0)+dt;if(e.agT>=5){e.agT=0;e.blinkT=1.2;puff(e.x,e.y-6,['#c9a6ff','#ffffff'],5)}}}
function affDeath(e){const a=e.aff;stAdd('affix');
  if(a.includes('explode')){boom(e.x,e.y,50,'#ff8a3a');puff(e.x,e.y-4,['#ffd040','#ff6a3a','#24160f'],14);sfx('boom');shake(2);const n=empTowers(e,3,1.8,55);void n}

/* ================= chapter comics: a few pixel panels with captions and speech bubbles ================= */
const CW=480,CHh=250;
const PCV={};function pc(kind){if(PCV[kind])return PCV[kind];const c=mk(22*SC,22*SC),g=c.getContext('2d');g.imageSmoothingEnabled=false;g.setTransform(SC,0,0,SC,0,0);portrait(kind,g);return PCV[kind]=c}
function cput(g,c,x,y,s=1,flip=false,a=1){if(!c)return;const w=c.lw*s,h=c.lh*s;g.save();g.globalAlpha=a;g.translate(Math.round(x*SC)/SC,Math.round(y*SC)/SC);if(flip)g.scale(-1,1);g.drawImage(c,-w/2,-h,w,h);g.restore()}
const ccat=(g,k,x,y,s=2.2,flip=false,a=1)=>cput(g,pc(k),x,y+2*s,s,flip,a);
const cdog=(g,k,x,y,s=1.6,flip=false,a=1)=>cput(g,DOG[k][Math.floor(performance.now()/260)%2],x,y,s,flip,a);
const cdogStill=(g,k,x,y,s=1.6,flip=false,a=1)=>cput(g,DOG[k][0],x,y,s,flip,a);
function csky(g,c1,c2,c3){const gr=g.createLinearGradient(0,0,0,CHh);gr.addColorStop(0,c1);gr.addColorStop(.6,c2);gr.addColorStop(1,c3||c2);g.fillStyle=gr;g.fillRect(0,0,CW,CHh)}
function cstars(g,n,seed,t,col='#ffffff'){const r=mulberry(seed);for(let i=0;i<n;i++){const x=r()*CW,y=r()*CHh*.6,p=r()*6;g.globalAlpha=.35+.65*Math.abs(Math.sin(t*1.5+p));g.fillStyle=r()<.15?'#ffe08a':col;const s=r()<.12?2:1;g.fillRect(Math.round(x),Math.round(y),s,s)}g.globalAlpha=1}
function cground(g,y,c1,c2,wave=6,seed=1){g.fillStyle=c1;g.beginPath();g.moveTo(0,CHh);for(let x=0;x<=CW;x+=8)g.lineTo(x,y+Math.sin(x*.02+seed)*wave+Math.sin(x*.053+seed*2)*wave*.5);g.lineTo(CW,CHh);g.fill();
  g.strokeStyle=c2;g.lineWidth=2;g.beginPath();for(let x=0;x<=CW;x+=8){const yy=y+Math.sin(x*.02+seed)*wave+Math.sin(x*.053+seed*2)*wave*.5;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke()}
function chills(g,y,col,amp=30,seed=3){g.fillStyle=col;g.beginPath();g.moveTo(0,CHh);for(let x=0;x<=CW;x+=10)g.lineTo(x,y-Math.abs(Math.sin(x*.012+seed))*amp);g.lineTo(CW,CHh);g.fill()}
function cglow(g,x,y,r,col,a=.6){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.globalAlpha=1}
function crays(g,x,y,col,t,n=12,len=300){g.save();g.translate(x,y);g.rotate(t*.15);g.fillStyle=col;for(let i=0;i<n;i++){g.rotate(Math.PI*2/n);g.globalAlpha=.12;g.beginPath();g.moveTo(0,0);g.lineTo(len,-18);g.lineTo(len,18);g.fill()}g.restore();g.globalAlpha=1}
function cmoon(g,x,y,r,col='#fff6c0'){cglow(g,x,y,r*3,col,.25);g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='rgba(0,0,0,.08)';g.beginPath();g.arc(x-r*.3,y-r*.2,r*.25,0,7);g.arc(x+r*.35,y+r*.3,r*.18,0,7);g.fill()}
function cfog(g,t,col,y0=150,n=6,a=.18){g.fillStyle=col;for(let i=0;i<n;i++){const x=((i*131+t*(8+i*2))%(CW+200))-100,y=y0+(i*37)%60;g.globalAlpha=a;g.beginPath();g.ellipse(x,y,90,16,0,0,7);g.fill()}g.globalAlpha=1}
function cbowl(g,x,y,s,t){cglow(g,x,y-6*s,40*s,'#ffe08a',.55+.15*Math.sin(t*3));cput(g,BOWL_S,x,y,s);for(let i=0;i<4;i++){const a=t*2+i*1.6;g.fillStyle='#ffffff';g.fillRect(Math.round(x+Math.cos(a)*16*s),Math.round(y-8*s+Math.sin(a)*7*s),2,2)}}
function cspeed(g,x,y,len,col='#ffffff',a=.5){g.strokeStyle=col;g.globalAlpha=a;g.lineWidth=1.5;for(let i=0;i<5;i++){const yy=y+i*7-14;g.beginPath();g.moveTo(x,yy);g.lineTo(x+len*(.6+.4*((i*37)%5)/5),yy);g.stroke()}g.globalAlpha=1}
function csfx(g,txt,x,y,size,col,rot=-.12,t=0){g.save();g.translate(x,y);g.rotate(rot+Math.sin(t*8)*.03);g.font=`700 ${size}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=size/5;g.strokeStyle='#24160f';g.strokeText(txt,0,0);g.fillStyle=col;g.fillText(txt,0,0);g.restore()}
function cwrap(g,txt,maxW){const out=[];let line='';for(const w of txt.split(' ')){const tl=line?line+' '+w:w;if(g.measureText(tl).width>maxW&&line){out.push(line);line=w}else line=tl}if(line)out.push(line);return out}
function ccap(g,txt,a){if(!txt)return 0;g.save();g.globalAlpha=a;g.font=`600 11px ${FONT}`;const lines=cwrap(g,txt,CW-40),h=lines.length*14+10,w=Math.min(CW-16,Math.max(...lines.map(l=>g.measureText(l).width))+20);
  g.fillStyle='#24160f';g.fillRect(6,6,w+4,h+4);g.fillStyle='#f6d98a';g.fillRect(8,8,w,h);g.fillStyle='#e3bf62';g.fillRect(8,8+h-3,w,3);g.fillStyle='#24160f';g.textBaseline='top';lines.forEach((l,i)=>g.fillText(l,18,13+i*14));g.restore();return h+12}

  const tx=b.tx,ty=b.ty,bx=Math.max(x+12,Math.min(x+w-12,tx)),by=ty<y?y:y+h;
  g.fillStyle='#24160f';g.beginPath();g.moveTo(bx-7,by);g.lineTo(tx,ty);g.lineTo(bx+7,by);g.fill();
  g.fillStyle='#24160f';g.beginPath();g.roundRect(x-2,y-2,w+4,h+4,9);g.fill();g.fillStyle=b.shout?'#fff1b0':'#ffffff';g.beginPath();g.roundRect(x,y,w,h,8);g.fill();

  if(b.who){g.font=`700 9px ${FONT}`;const ww=g.measureText(b.who).width+10;g.fillStyle='#24160f';g.fillRect(x+6,y-13,ww,12);g.fillStyle='#f2b84b';g.textBaseline='top';g.fillText(b.who,x+11,y-11)}

let TSEL={col:1,id:'a1'};

function towerBars(type,extra){
  const keep=SIM_TREE;let cur,nxt;
  const calc=()=>{const s=stat({type,lvl:2,br:0});return{dmg:s.dmg*(s.splash?1+s.splash/40:1)/s.rate,range:s.range,speed:1/s.rate}};
  SIM_TREE={...SAVE.tree};cur=calc();if(extra){SIM_TREE[extra]=1;nxt=calc()}else nxt=cur;
  const all={...SAVE.tree};Object.keys(NODES).forEach(k=>all[k]=1);SIM_TREE=all;
  const mx={dmg:0,range:0,speed:0};for(const k of TYPE_KEYS){const s=stat({type:k,lvl:2,br:0});mx.dmg=Math.max(mx.dmg,s.dmg*(s.splash?1+s.splash/40:1)/s.rate);mx.range=Math.max(mx.range,s.range);mx.speed=Math.max(mx.speed,1/s.rate)}
  SIM_TREE=keep;
  const pip=(v,m)=>Math.max(1,Math.min(5,Math.round(v/m*5)));
  return[['dmg','Урон в секунду',pip(cur.dmg,mx.dmg),pip(nxt.dmg,mx.dmg)],['range','Дальность',pip(cur.range,mx.range),pip(nxt.range,mx.range)],['speed','Скорость атаки',pip(cur.speed,mx.speed),pip(nxt.speed,mx.speed)]]}
function generalBars(extra){const t={...SAVE.tree};const v=k=>t[k]?1:0,w=k=>(t[k]||extra===k)?1:0;

function bot(order,brPref,opt){
  S.traps.forEach((tr,i)=>{if(tr.cd>0||tr.fuse>0)return;let n=0,b=false;for(const e of S.enemies){if(untargetable(e)||ENEMY[e.type].fly)continue;if(Math.hypot(e.x-tr.px,e.y-tr.py)<30){n++;if(ENEMY[e.type].boss)b=true}}if(n>=4||b)fireTrap(i)});

    const built=S.slots.filter(s=>s.tower),types=order.filter(k=>LV.towers.includes(k)),lvSum=built.reduce((a,s)=>a+Math.min(s.tower.lvl,2),0);
    const empty=(S.mf.limit&&built.length>=LIMIT_N)?-1:S.slots.findIndex(s=>!s.tower&&!s.over),ovi=S.slots.findIndex(s=>s.over);
    if(empty<0&&ovi>=0&&!S.mf.limit&&S.fish>=overCost()){clearOver(ovi);continue}
    const cand=built.filter(s=>s.tower.lvl<2||(s.tower.lvl===2&&has(PFX[s.tower.type]+'3'))).sort((a,b)=>a.tower.lvl-b.tower.lvl)[0];
    const upCost=cand?(cand.tower.lvl<2?cost(TYPES[cand.tower.type].ups[cand.tower.lvl]):cost(TYPES[cand.tower.type].br[brPref[cand.tower.type]].cost)):1e9;
    const k=types[built.length%types.length],bc=cost(TYPES[k].cost);

  }
}

  const head=`<h2>Сундук героев</h2><p class="muted">Сундуков: <b>${SAVE.chests}</b> · Осколки героя: ${SAVE.shards}/${SHARDS_NEED} · Шанс нового героя в сундуке: 18%${miss.length?'':' · все герои уже с тобой!'}</p>`;
  let body;
  if(CH.state==='idle')body=`<div class="cstage"><img class="chest${SAVE.chests?' bob':''}" alt="" src="${chestURL(0)}"></div><p class="muted">Сундуки дают за победу над боссом: два за первую, по одному за повторные.</p>`;
  else body=`<div class="cstage"><div class="reel"><div class="track" id="track">${CH.items.map(i=>rewardItem(i.k,i.h)).join('')}</div><div class="pin"></div></div></div>
    <div class="reveal" id="reveal" ${CH.state==='done'?'':'hidden'}>${revealHtml()}</div>`;
  const btns=CH.state==='spin'?'':`<div class="row">${SAVE.chests?`<button class="primary" id="cOpen">${CH.state==='done'?'Ещё сундук':'Открыть сундук'} · ${SAVE.chests}</button>`:''}<button id="cHeroes">Герои</button><button id="cBack">В меню</button></div>`;
  return head+body+btns}
function revealHtml(){const r=CH.res;if(!r)return'';
  const bonus=r.bonusHero?`<p class="win">Осколки собраны: к тебе присоединяется ${HERO[r.bonusHero].name}!</p>`:'';
  if(r.kind==='hero')return`<p class="win">Новый герой: ${HERO[r.hero].name}!</p><p class="muted">${HERO[r.hero].title} · ${HERO[r.hero].ab}: ${HERO[r.hero].desc}</p>`;
  if(r.kind==='shard')return`<p>Осколок героя: ${SAVE.shards}/${SHARDS_NEED}</p>`+bonus;
  return`<p>Клубки: +${r.kind.slice(4)} 🧶 для дерева прокачки</p>`}
function startSpin(){const res=openChest();if(!res)return;CH={state:'spin',res,items:[]};const N=46,WIN=40;
  for(let i=0;i<N;i++){const k=i===WIN?res.kind:rollKind();CH.items.push({k:k==='yarn3'?'yarn2':k,h:i===WIN?(res.hero||res.bonusHero):HERO_KEYS[1+(Math.random()*5|0)]})}
  if(res.kind==='yarn3')CH.items[WIN]={k:'yarn2'};
  showOverlay();const c=$('ovCard');c.querySelector('.cstage').classList.add('pop');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const tr=$('track'),it=tr.children[WIN],reel=tr.parentElement,off=it.offsetLeft+it.offsetWidth/2-reel.clientWidth/2+(Math.random()-.5)*it.offsetWidth*.6;
    tr.style.transition='transform 4.6s cubic-bezier(.12,.72,.14,1)';tr.style.transform=`translateX(${-off}px)`;
    const stepW=(tr.children[1].offsetLeft-tr.children[0].offsetLeft)||40;let lastI=0;const tk=setInterval(()=>{try{const i=Math.floor(-new DOMMatrix(getComputedStyle(tr).transform).m41/stepW);if(i!==lastI){lastI=i;sfx('tick')}}catch(e){}},25);
    let doneOnce=false;const done=()=>{if(doneOnce)return;doneOnce=true;clearInterval(tk);sfx(res.kind==='hero'||res.bonusHero?'jackpot':'card');CH.state='done';it.classList.add('won');const rv=$('reveal');if(rv){rv.hidden=false;rv.innerHTML=revealHtml()}
      const ctl=document.createElement('div');ctl.className='row';ctl.innerHTML=`${SAVE.chests?`<button class="primary" id="cOpen">Ещё сундук · ${SAVE.chests}</button>`:''}<button id="cHeroes">Герои</button><button id="cBack">В меню</button>`;c.appendChild(ctl);wireChest()};
    tr.addEventListener('transitionend',done,{once:true});setTimeout(done,5200)}))}
function wireChest(){if($('cOpen'))$('cOpen').onclick=startSpin;if($('cBack'))$('cBack').onclick=goTitleMenu;if($('cHeroes'))$('cHeroes').onclick=()=>{S.mode='heroes';showOverlay()}}
let HSEL='murlin';
function heroesHtml(){const own=k=>SAVE.heroes.includes(k),H=HERO[HSEL];
  const cells=HERO_KEYS.map(k=>`<button class="hcell${own(k)?'':' lock'}${k===HSEL?' on':''}${SAVE.hero===k?' cur':''}" data-h="${k}"><img alt="" src="${heroURL(k,!own(k))}"><span>${own(k)?HERO[k].short:'???'}</span></button>`).join('');
  const act=own(HSEL)?(SAVE.hero===HSEL?'<span class="st ok">✔ Идёт в бой</span>':`<button class="primary" id="hPick">Взять в бой</button>`):`<span class="st">Найди в сундуке героев</span>`;
  return`<h2>Герои</h2><div class="hgrid">${cells}</div>
  <div class="bdet"><div class="pic"><img alt="" src="${heroURL(HSEL,!own(HSEL))}"></div><div><h3>${own(HSEL)?H.name:'Неизвестный герой'} <small>${own(HSEL)?H.title:''}</small></h3>
    <p>${own(HSEL)?`<b style="color:${H.col}">${H.ab}</b> · перезарядка ${Math.round(H.cd*(has('g3')?.65:1)*(has('g8b')?.85:1)*(1-afFor(HSEL).cd))} с. ${H.desc}`:'Этот герой ждёт тебя в одном из сундуков.'}</p><div class="buy">${act}${own(HSEL)?`<span class="st">Артефакты:</span>${slotsHtml(HSEL)}`:''}</div></div></div>
  <div class="shards"><span>Осколки: ${SAVE.shards}/${SHARDS_NEED}</span><i style="width:${SAVE.shards/SHARDS_NEED*100}%"></i></div>
  <div class="row">${SAVE.chests?`<button class="primary" id="hChest">Сундуки · ${SAVE.chests}</button>`:''}<button id="hForge">Кузница</button><button id="hBack">В меню</button></div>`}
function wireHeroes(c){c.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{HSEL=b.dataset.h;showOverlay()});if($('hPick'))$('hPick').onclick=()=>{SAVE.hero=HSEL;persist();showOverlay()};
  if($('hChest'))$('hChest').onclick=()=>{CH={state:'idle'};S.mode='chest';showOverlay()};$('hForge').onclick=()=>{S.mode='forge';showOverlay()};$('hBack').onclick=goTitleMenu}


/* ================= forge: craft and equip artifacts ================= */
let ASEL='bell';
const wearer=k=>HERO_KEYS.find(h=>(SAVE.eq[h]||[]).includes(k));
function canPay(o){return ORE_KEYS.every(k=>(SAVE.ore[k]|0)>=(o[k]|0))}
function forgeHtml(){const A=ARTS[ASEL],t=SAVE.arts[ASEL]|0,w=wearer(ASEL),hero=SAVE.hero;
  const cells=ART_KEYS.map(k=>{const tt=SAVE.arts[k]|0,wh=wearer(k);return`<button class="acell${k===ASEL?' on':''}${tt?'':' none'}" data-a="${k}"><img alt="" src="${artURL(k,!tt)}"><span class="pp">${'★'.repeat(tt)}<i>${'★'.repeat(3-tt)}</i></span>${wh?`<img class="wh" alt="" src="${heroURL(wh,false)}">`:''}</button>`}).join('');
  const lines=[0,1,2].map(i=>`<li class="${i<t?'got':''}${i===t?' next':''}">${'★'.repeat(i+1)} ${A.eff(i)}</li>`).join('');
  const next=t<3?A.cost[t]:null;
  const act=`${next?`<button class="primary" id="aCraft" ${canPay(next)?'':'disabled'}>${t?'Улучшить':'Выковать'}</button><span class="cost">${oreChips(next,true)}</span>`:'<span class="st ok">✔ Максимальный уровень</span>'}
    ${t?(w===hero?`<button id="aOff">Снять с героя</button>`:`<button id="aOn">Надеть на ${HERO[hero].short}</button>`):''}`;
  return`<h2>Кузница артефактов</h2><div class="ores">${ORE_KEYS.map(k=>`<span class="ore" title="${ORES[k].name}"><img alt="" src="${oreURL(k)}">${SAVE.ore[k]|0}</span>`).join('')}<small>руда падает с боссов</small></div>
  <div class="agrid">${cells}</div>
  <div class="bdet"><div class="pic"><img alt="" src="${artURL(ASEL,!t)}"></div><div><h3>${A.name} <small>${t?'уровень '+t:'ещё не выкован'}${w?' · у героя '+HERO[w].short:''}</small></h3><p>${A.fl}</p><ul class="eff">${lines}</ul><div class="buy">${act}</div></div></div>
  <div class="row"><button id="fHeroes">Герои</button><button id="fBack">В меню</button></div>`}
function equipArt(k,h){for(const hh in SAVE.eq)SAVE.eq[hh]=(SAVE.eq[hh]||[]).map(x=>x===k?null:x);const sl=SAVE.eq[h]||(SAVE.eq[h]=[null,null]);const i=sl[0]==null?0:sl[1]==null?1:1;sl[i]=k;persist()}
function unequipArt(k){for(const hh in SAVE.eq)SAVE.eq[hh]=(SAVE.eq[hh]||[]).map(x=>x===k?null:x);persist()}
function wireForge(c){c.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ASEL=b.dataset.a;showOverlay()});
  if($('aCraft'))$('aCraft').onclick=()=>{const t=SAVE.arts[ASEL]|0,o=ARTS[ASEL].cost[t];if(t>=3||!canPay(o))return;for(const k in o)SAVE.ore[k]-=o[k];SAVE.arts[ASEL]=t+1;if(!t&&!wearer(ASEL)){const sl=SAVE.eq[SAVE.hero]||[null,null];if(sl.includes(null))equipArt(ASEL,SAVE.hero)}persist();showOverlay()};
  if($('aOn'))$('aOn').onclick=()=>{equipArt(ASEL,SAVE.hero);showOverlay()};if($('aOff'))$('aOff').onclick=()=>{unequipArt(ASEL);showOverlay()};
  $('fHeroes').onclick=()=>{HSEL=SAVE.hero;S.mode='heroes';showOverlay()};$('fBack').onclick=goTitleMenu}
function slotsHtml(h,small){const sl=SAVE.eq[h]||[null,null];return`<span class="aslots${small?' sm':''}">${[0,1].map(i=>sl[i]?`<button class="aslot" data-slot="${h}|${sl[i]}" title="${ARTS[sl[i]].name}"><img alt="" src="${artURL(sl[i],false)}"></button>`:`<button class="aslot empty" data-slot="${h}|" title="Пустой слот">+</button>`).join('')}</span>`}
function wireSlots(c){c.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const [h,k]=b.dataset.slot.split('|');SAVE.hero=SAVE.heroes.includes(h)?h:SAVE.hero;persist();ASEL=k||ART_KEYS.find(x=>SAVE.arts[x]&&!wearer(x))||ASEL;S.mode='forge';showOverlay()})}

/* ================= loop & hot reload ================= */
let last=0,idleAt=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(S.mode==='play'&&!S.paused&&!PORTRAIT.matches){let d=dt;if(S.slowT>0){S.slowT-=dt;d*=.3}for(let i=0;i<S.speed&&S.mode==='play';i++)update(d);render();panel()}
  else if(S.mode==='studio'&&!PORTRAIT.matches){S.time+=dt;renderStudio()}
  else if((S.mode==='title'||S.mode==='menu')&&!PORTRAIT.matches){S.time+=dt;renderTitle()}
  else if(S.mode==='bestiary'||S.mode==='settings'||S.mode==='modes'||S.mode==='ach'||S.mode==='chest'||S.mode==='heroes'||S.mode==='forge'||S.mode==='chron'){S.time+=dt;if(ts-idleAt>60){idleAt=ts;renderTitle()}}
  else{if(S.mode!=='play')S.time+=dt;if(ts-idleAt>125){idleAt=ts;render();panel()}} // menus and pause redraw ~8 times a second
  applyShake(dt);requestAnimationFrame(frame);
}
function snapshot(){return{v:3,level:LVI,fish:S.fish,lives:S.lives,wave:S.wave,mode:RUN?'map':S.mode==='cards'?'play':S.mode,towers:S.slots.map(sl=>sl.tower&&{type:sl.tower.type,lvl:sl.tower.lvl,br:sl.tower.br,spent:sl.tower.spent})}}
function boot(data){
  setLevel(0,true);S=freshState();
  try{if(data&&data.v===3&&LEVELS[data.level]){setLevel(data.level);S=freshState();S.fish=data.fish;S.lives=data.lives;S.wave=data.wave;S.mode=['play','intro','map','tree'].includes(data.mode)?data.mode:'map';
    (data.towers||[]).forEach((t,i)=>{if(t&&S.slots[i]){const tw=makeTower(t.type);tw.lvl=t.lvl;tw.br=t.br||0;tw.spent=t.spent;S.slots[i].tower=tw}})}}catch(e){setLevel(0);S=freshState()}
  if(!(data&&data.v===3&&data.mode&&data.mode!=='map')){S.mode='studio';S.time=0}
  fit();
  if(S.mode!=='title'&&S.mode!=='studio')paintBg(S.mode!=='play');
  if(S.mode==='play'){flushBg();$('ov').hidden=true;panel(true)}else showOverlay();
  requestAnimationFrame(frame);
}
try{window.claude?.hot?.snapshot?.(snapshot)}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>
